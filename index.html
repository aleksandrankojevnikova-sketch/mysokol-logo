<title>MySokol — animated logo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent}
body{display:grid;place-items:center;overflow:hidden}
.stage{width:min(96vw,1200px);padding:2vw}
svg{display:block;width:100%;height:auto;overflow:visible}
svg path{fill:transparent;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}
.svg-elem-1{stroke:#458C77;stroke-dasharray:26831.068359375;stroke-dashoffset:26831.068359375;transition:stroke-dashoffset 1.15s cubic-bezier(.47,0,.745,.715),fill .75s cubic-bezier(.47,0,.745,.715) .85s}
.svg-elem-2{stroke:#7CB0E0;stroke-dasharray:49427.58984375;stroke-dashoffset:49427.58984375;transition:stroke-dashoffset 1.15s cubic-bezier(.47,0,.745,.715) .12s,fill .75s cubic-bezier(.47,0,.745,.715) .97s}
.svg-elem-3{stroke:#7CB0E0;stroke-dasharray:27235.76171875;stroke-dashoffset:27235.76171875;transition:stroke-dashoffset 1.15s cubic-bezier(.47,0,.745,.715) .24s,fill .75s cubic-bezier(.47,0,.745,.715) 1.09s}
svg.active .svg-elem-1{stroke-dashoffset:0;fill:#458C77}
svg.active .svg-elem-2,svg.active .svg-elem-3{stroke-dashoffset:0;fill:#7CB0E0}
@media(prefers-reduced-motion:reduce){
 svg path{transition:none!important;stroke-dashoffset:0!important}
 .svg-elem-1{fill:#458C77!important}
 .svg-elem-2,.svg-elem-3{fill:#7CB0E0!important}
}
</style>
</head>

<script>
